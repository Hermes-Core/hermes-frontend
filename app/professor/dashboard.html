<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel do professor: visão geral das turmas e atividades.">
  <title>Dashboard do Professor — Hermes</title>
  <link rel="icon" type="image/x-icon" href="../../img/favicon.ico">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-role="professor" data-page="dashboard">

  <div class="page">
    <div class="page-header">
      <h1>Dashboard</h1>
      <p>Visão geral das suas turmas e atividades</p>
    </div>

    <div class="stat-grid" id="indicadores"></div>

    <div class="stack">
      <div class="grid-2">
        <section class="card" aria-labelledby="titulo-turmas">
          <div class="card-header">
            <h2 class="card-title" id="titulo-turmas">
              <span class="icon" data-icon="users" data-icon-size="22"></span> Minhas Turmas
            </h2>
          </div>
          <div id="lista-turmas"></div>
        </section>

        <section class="card" aria-labelledby="titulo-proximas">
          <div class="card-header">
            <h2 class="card-title" id="titulo-proximas">
              <span class="icon" data-icon="clipboard" data-icon-size="22"></span> Próximas Atividades
            </h2>
            <a class="btn btn-outline btn-sm" href="atividades.html">Cadastrar nova</a>
          </div>
          <div id="lista-proximas"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/professor.js"></script>
</body>
</html>
