<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Central de notificações e comunicados da escola.">
  <title>Notificações — Hermes</title>
  <link rel="icon" type="image/x-icon" href="../../img/favicon.ico">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body data-role="responsavel" data-page="notificacoes">

  <div class="page">
    <div class="page-header">
      <h1>Notificações</h1>
      <p>Comunicados, avisos e alertas enviados pela escola</p>
    </div>

    <section class="card" aria-labelledby="titulo-notificacoes">
      <div class="card-header">
        <h2 class="card-title" id="titulo-notificacoes">
          <span class="icon" data-icon="bell" data-icon-size="22"></span> Caixa de Entrada
        </h2>
        <div class="btn-row">
          <div class="field" style="margin:0">
            <label class="sr-only" for="filtro-prioridade">Filtrar por prioridade</label>
            <select id="filtro-prioridade">
              <option value="">Todas as prioridades</option>
              <option value="urgente">Urgente</option>
              <option value="importante">Importante</option>
              <option value="normal">Normal</option>
            </select>
          </div>
          <button type="button" class="btn btn-outline" id="marcar-lidas">
            <span class="icon" data-icon="check"></span> Marcar todas como lidas
          </button>
        </div>
      </div>

      <div id="lista-notificacoes"></div>
    </section>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/responsavel.js"></script>
</body>
</html>
